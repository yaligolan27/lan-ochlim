<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>לאן אוכלים · מפת הגודיס</title>
<meta name="description" content="כל המסעדות שמכבדות גודיס באזור תל אביב, על מפה אחת, עם מפגשי צהריים עם החבר׳ה">
<meta name="theme-color" content="#24361a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="לאן אוכלים">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Karantina:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div id="map" role="region" aria-label="מפת המסעדות"></div>

  <aside class="side" id="side">
    <header class="topbar">
      <a class="brand" href="#" data-act="home" aria-label="לאן אוכלים — מסך הבית">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40"><rect width="40" height="40" rx="12" fill="var(--olive)"/><path d="M20 7c-6 0-10.5 4.4-10.5 10.3C9.5 24.6 20 33 20 33s10.5-8.4 10.5-15.7C30.5 11.4 26 7 20 7z" fill="var(--amba)"/><path d="M16.6 12.5v4.4c0 1.2.8 2 1.9 2.2V25M19.4 12.5v4.4M22 12.5c1.6.6 2.3 2.4 2.3 4.6 0 1.4-.6 2-1.4 2.2V25" stroke="var(--olive)" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg></span>
        <span class="brand-text"><b>לאן אוכלים</b><small>מפת הגודיס</small></span>
      </a>
      <label class="search">
        <span class="sr-only">חיפוש</span>
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/><path d="M21 21l-6 -6"/></svg>
        <input id="q" type="search" autocomplete="off" placeholder="מסעדה, עיר או סוג אוכל" enterkeyhint="search">
      </label>
      <button class="me-btn" id="meBtn" data-act="tab" data-tab="me" aria-label="הפרופיל שלי"></button>
    </header>
    <div class="chips" id="chips" role="toolbar" aria-label="סינון"></div>
    <nav class="tabs" id="tabs" aria-label="ניווט ראשי"></nav>
    <section class="panel" id="panel" data-state="half">
      <button class="handle" id="handle" aria-label="הרחב או כווץ את הרשימה"><span></span></button>
      <div class="panel-body" id="view"></div>
    </section>
  </aside>

  <div class="map-tools" id="mapTools">
    <button class="round-btn" data-act="toggle3d" id="btn3d" aria-label="תצוגה בתלת-ממד" title="תלת-ממד"></button>
    <button class="round-btn" data-act="basemap" id="baseBtn" aria-label="תצוגת מפה"></button>
    <button class="round-btn" data-act="locate" aria-label="המיקום שלי" title="המיקום שלי"></button>
  </div>
  <button class="fab" id="fab" data-act="now">
    <span class="fab-ic"></span><span>יוצא לאכול</span>
  </button>

  <section class="sheet" id="sheet" hidden aria-modal="false" role="dialog" aria-label="פרטי מסעדה"></section>
  <section class="route-card" id="routeCard" hidden aria-label="מסלול"></section>
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="תמונות"></div>
  <div class="modal" id="modal" hidden><div class="modal-card" id="modalCard" role="dialog" aria-modal="true"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>
<script src="config.js"></script>
<script src="icons.js"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="app1.js"></script>
<script src="app2.js"></script>
<script src="app3.js"></script>
</body>
</html>
